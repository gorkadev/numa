name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Test
        working-directory: apps/web
        run: pnpm exec tsx --test $(find . -name "*.test.ts*" -not -path "./node_modules/*" -not -path "./.next/*" -not -path "./.trigger/*")

      # Placeholder values: the build only needs the variables to exist, it
      # never connects to any of these services.
      - name: Build
        run: pnpm --filter web build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          DATABASE_URL_UNPOOLED: postgres://ci:ci@localhost:5432/ci
          NEON_BRANCH: ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3000
          DAYTONA_API_KEY: ci
          DAYTONA_GAME_SNAPSHOT: ci
          GOOGLE_VERTEX_PROJECT: ci
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          POLAR_ACCESS_TOKEN: ci
          POLAR_WEBHOOK_SECRET: ci
          POLAR_SERVER: sandbox
          POLAR_PRODUCT_FREE_ID: ci
          POLAR_PRODUCT_PRO_ID: ci
          POLAR_PRODUCT_MAX_ID: ci
          POLAR_METER_ID: ci
          R2_ACCOUNT_ID: ci
          R2_ACCESS_KEY_ID: ci
          R2_SECRET_ACCESS_KEY: ci
          R2_UPLOADS_BUCKET: ci
          PREVIEW_TOKEN_SECRET: ci-placeholder-preview-secret
          TRIGGER_SECRET_KEY: tr_dev_ci
