<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>numa — your game goes here</title>

    <!--
      The import map is what makes `import * as THREE from "three"` work with no
      bundler and no network: it points the bare specifiers at the copy of
      three.js that ships inside the sandbox. Every game needs these two lines,
      and they must live in the document that loads the modules — an import map
      inside a module file does nothing.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>

    <style>
      :root {
        --fg: #10172a;
        --muted: rgba(16, 23, 42, 0.62);
        --accent: #2563eb;
      }

      html,
      body {
        height: 100%;
      }

      /*
        The same sky the scene paints, so the page already looks finished
        before the models arrive — and stays finished if they never do.
      */
      body {
        margin: 0;
        overflow: hidden;
        background: linear-gradient(180deg, #7fb6ff 0%, #b9d8ff 50%, #ffe3c7 100%);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      canvas {
        opacity: 0;
        transition: opacity 1.2s ease;
      }

      body.ready canvas {
        opacity: 1;
      }

      /*
        The copy rides at the bottom in a frosted card, leaving the island the
        middle of the frame. It never intercepts the pointer, so moving across
        it still steers the camera.
      */
      #overlay {
        position: fixed;
        inset: auto 0 0;
        z-index: 2;
        display: flex;
        justify-content: center;
        padding: 0 1rem max(1.5rem, 5vh);
        pointer-events: none;
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
        max-width: 26rem;
        padding: 1.1rem 1.4rem 1rem;
        border-radius: 1.4rem;
        border: 1px solid rgba(255, 255, 255, 0.7);
        background: rgba(255, 255, 255, 0.62);
        box-shadow: 0 18px 50px -18px rgba(30, 58, 138, 0.45);
        backdrop-filter: blur(14px) saturate(1.4);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
        text-align: center;
        animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }

      h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.55;
        color: var(--muted);
        text-wrap: balance;
      }

      .hint {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-top: 0.35rem;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--accent);
      }

      /*
        Three dots pulsing is the only moving thing guaranteed to be on screen:
        if WebGL is unavailable the scene never appears, and a completely still
        page is indistinguishable from a broken one.
      */
      .dots {
        display: inline-flex;
        gap: 0.22rem;
      }

      .dots span {
        width: 0.28rem;
        height: 0.28rem;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 1.4s ease-in-out infinite;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.18s;
      }

      .dots span:nth-child(3) {
        animation-delay: 0.36s;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        canvas,
        .card {
          transition: none;
          animation: none;
        }

        .dots span {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>

  <body>
    <div id="overlay">
      <div class="card">
        <h1 data-copy="title">Your game will appear here</h1>
        <p data-copy="body">
          Describe the game you want in the chat and it starts building right
          here.
        </p>
        <span class="hint">
          <span class="dots" aria-hidden="true"
            ><span></span><span></span><span></span
          ></span>
          <span data-copy="hint">Waiting for your idea</span>
        </span>
      </div>
    </div>

    <script type="module">
      /*
        The app speaks English and Spanish; the frame cannot ask it which one
        is active, so it follows the browser instead. English is the fallback
        already in the markup.
      */
      const COPY = {
        es: {
          title: "Aquí aparecerá tu juego",
          body: "Describe en el chat el juego que quieres y empezará a construirse aquí mismo.",
          hint: "Esperando tu idea",
        },
      }
      const language = (navigator.language || "en").slice(0, 2)
      if (COPY[language]) {
        document.documentElement.lang = language
        for (const element of document.querySelectorAll("[data-copy]")) {
          element.textContent = COPY[language][element.dataset.copy]
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three"
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"
      import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js"

      import { createEngine } from "./engine/engine.js"
      import { addEnvironment } from "./engine/lighting.js"
      import { createParticles } from "./engine/fx.js"
      import { damp, random } from "./engine/math.js"

      /*
        A floating island built from the Cube World kit, loaded from numa's
        public asset bucket rather than copied into every sandbox: these are the
        exact blobs the cube-world template locks, addressed by SHA-256, so they
        never change under this page. Without the network the page keeps its CSS
        sky and the card — a complete, if still, welcome screen.
      */
      const BLOBS = "https://pub-c9cfca53d8364237968cc4355d3c0f7c.r2.dev/blobs/"
      const MODELS = {
        grass: "e2dde03b02e38ac6677a5c50c6922318ff86d7d497668b33704761df7477755b",
        dirt: "c7945d45f317446be05a884d3f5d5be989507ad657c898e5726aeb8ba6595520",
        stone: "61a87b1f3ff4fe0dd37cf05e149c7487ce8c6c0c0f571fb0a23c6084cf73f07b",
        tree1: "f4f4bd56416e432721cdc1f42c2ca2a17793660455ca494fe3bb44a738cd02f4",
        tree2: "a3dcf4fc33b70e6844afdb9f8f6a2543b373f6973f438b0377e3309b08acabee",
        tree3: "acbbf1ed786a58ce2f31843a59127e38c7cde70e7ba2e34af01df37aabca9004",
        bush: "2e1e490f8018c9956ec001936d529d5883a21ef0778a7f8a22cd67027d3b08ee",
        flowers1: "a79267e588fb84207655b42ebefaffd1f248c2ecc8f852ba30fd8a65fb4d7cfb",
        flowers2: "04068581f19bb875eb29cf118a67d9320f2ea410409353231a97e0f8f9c64899",
        grassBig: "8249d23c9497792c1b783dc7666f92e0a7dac9726bae809c24b744c39fc7a00d",
        mushroom: "99a04171502c28b0a46ca34a8153bb949ae35d1bb3d3d37a077333d69cb5e639",
        rock1: "8aafa87d57cdf4649480ed09c78e292d2573f2a53855f9dabeb5deb9d33d3b77",
        rock2: "b1450d24b1f18730502d3e4eb18273c8cc151b086ae2bea280181fd7f26f3a6f",
        fence: "fddc948a54d567616a6a664b0fa28890a05bcd0347dcfca59698c8a576a56688",
        fenceEnd: "ec925273b3f243bf8e1d2ec0fcc9eb9f685e63559cc922a272ce27ad3ff49b8f",
        chest: "1d04f0172f63952c0afcf62ca4d5fbbfd348cea1dc37185184c40c699c9f5fdf",
        crystal: "5ba846a8688282c80563c196ffd32f8e4c82f8c0635b1ca708ec065798fa08c0",
        sheep: "326e4970731ea76162c2d474c13db12142622b9102533d1920a73f41f87326e0",
        chick: "476aaee508a66e5c1318622196ceab244029eba1af110a701bcb6eaba92bebc1",
        pig: "d721e08403675db8f608a30d02952a0bc94e501871fb6c8a6ad19488ad03bbb5",
      }

      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches
      const motion = reducedMotion ? 0 : 1
      const rng = mulberry32(7)

      try {
        await start()
        document.body.classList.add("ready")
      } catch (error) {
        /* The CSS sky and the card are a complete page on their own. */
        console.warn("welcome scene unavailable", error)
      }

      async function start() {
        const engine = createEngine({
          background: false,
          fov: 32,
          cameraPosition: [15, 9.5, 15],
          lookAt: [0, 0.3, 0],
          fog: 0xcfe2ff,
          fogRange: [40, 90],
        })
        engine.add(buildSky())
        engine.renderer.toneMappingExposure = 1.05

        addLights(engine)
        addEnvironment(engine, 0.35)

        const models = await loadModels()
        const B = blockSize(models.grass.scene)

        /*
          Everything inside `world` is laid out in the kit's own units, one
          block being `B`; the group scales that down so a block is one unit in
          the scene, which keeps the camera and the lights readable.
        */
        const world = new THREE.Group()
        world.scale.setScalar(1 / B)
        engine.add(world)

        const island = buildIsland(models, B)
        island.group.add(buildFlag(island, B).pole)
        const critters = spawnCritters(models, island, B)
        world.add(island.group)

        const islets = [
          buildIslet(models, B, [-13, -1.5, -10], {
            radius: 2.1,
            props: [["tree3", 0.5], ["grassBig", 0.8], ["flowers1", 1]],
          }),
          buildIslet(models, B, [12, -3, -11], {
            radius: 1.6,
            props: [["bush", 0.5], ["rock1", 1]],
          }),
          buildIslet(models, B, [-10, -7.5, 6], {
            radius: 1.3,
            props: [["grassBig", 0.8]],
          }),
        ]
        for (const islet of islets) world.add(islet.group)

        const clouds = buildClouds()
        engine.add(clouds.group)

        /*
          Pollen in the sunlight: tiny warm specks drifting up past the island.
          They are what make the air read as air rather than a backdrop.
        */
        const pollen = createParticles(engine, {
          count: 90,
          size: 0.05,
          color: 0xfff1c2,
          gravity: 0.12,
          drag: 0.08,
          lifetime: Infinity,
        })
        for (let i = 0; i < 90; i++) {
          pollen.burst(
            new THREE.Vector3(random.range(-7, 7), random.range(-4, 5), random.range(-7, 7)),
            1,
            { speed: 0.08, spread: 1 }
          )
        }

        /*
          The camera swings gently around the island and leans towards the
          pointer, always drifting back — a diorama on a turntable, not a model
          viewer, so it can never be left facing the wrong way.
        */
        const pointer = { x: 0, y: 0 }
        window.addEventListener("pointermove", (event) => {
          pointer.x = (event.clientX / window.innerWidth) * 2 - 1
          pointer.y = (event.clientY / window.innerHeight) * 2 - 1
        })

        /* Narrow frames (the docked panel, phones) step back to keep the island whole. */
        let distance = 28
        engine.onResize(({ aspect }) => {
          distance = aspect < 0.8 ? 40 : aspect < 1.25 ? 33 : 28
        })

        /*
          Aimed below the island's middle, so the island sits in the upper part
          of the frame and its hanging rock clears the card at the bottom.
        */
        const target = new THREE.Vector3(0, -1.1, 0)
        let yaw = Math.PI / 4
        let pitch = 0.5
        const flag = island.group.userData.flag

        engine.onUpdate((dt, { elapsed }) => {
          island.group.position.y = Math.sin(elapsed * 0.55) * 0.18 * motion * B
          island.group.rotation.y = Math.sin(elapsed * 0.12) * 0.05 * motion

          for (const [i, islet] of islets.entries()) {
            islet.group.position.y = islet.baseY + Math.sin(elapsed * 0.5 + i * 1.7) * 0.3 * motion * B
          }

          flag.update(elapsed * motion)
          clouds.update(dt * motion)
          critters.update(dt * motion)

          const swing = Math.sin(elapsed * 0.09) * 0.42 * motion
          yaw = damp(yaw, Math.PI / 4 + swing + pointer.x * 0.25, 0.4, dt)
          pitch = damp(pitch, 0.5 - pointer.y * 0.08, 0.4, dt)

          engine.camera.position.set(
            Math.sin(yaw) * Math.cos(pitch) * distance,
            Math.sin(pitch) * distance,
            Math.cos(yaw) * Math.cos(pitch) * distance
          )
          engine.camera.lookAt(target)
        })

        engine.start()
      }

      /*
        The sky as a dome painted by a tiny shader rather than a background
        texture: a texture background goes through tone mapping and comes out
        grey, while this keeps the exact blue-to-peach of the CSS behind it.
      */
      function buildSky() {
        return new THREE.Mesh(
          new THREE.SphereGeometry(300, 32, 16),
          new THREE.ShaderMaterial({
            side: THREE.BackSide,
            depthWrite: false,
            fog: false,
            uniforms: {
              top: { value: new THREE.Color(0x4f9bff) },
              middle: { value: new THREE.Color(0xa9d0ff) },
              bottom: { value: new THREE.Color(0xffdcb8) },
            },
            vertexShader: `
              varying vec3 vDirection;
              void main() {
                vDirection = normalize(position);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform vec3 top;
              uniform vec3 middle;
              uniform vec3 bottom;
              varying vec3 vDirection;
              void main() {
                /*
                  Lifted horizon: the camera looks down at the island, so
                  most of what it sees is below true horizontal. Shifting the
                  split keeps the frame mostly blue with peach only low down.
                */
                float h = vDirection.y + 0.32;
                vec3 color = h > 0.0
                  ? mix(middle, top, smoothstep(0.0, 0.6, h))
                  : mix(middle, bottom, smoothstep(0.0, 0.3, -h));
                gl_FragColor = vec4(color, 1.0);
                #include <colorspace_fragment>
              }
            `,
          })
        )
      }

      /*
        A warm low sun for long shadows and a cool sky fill. The sun's shadow
        camera is fitted to the island alone: the default frustum is sized for a
        whole level, and spread that wide the shadows turn to mush.
      */
      function addLights(engine) {
        engine.add(new THREE.HemisphereLight(0xd6e8ff, 0x8a6f5c, 1.1))

        const sun = new THREE.DirectionalLight(0xfff0d6, 2.6)
        sun.position.set(9, 16, 6)
        sun.castShadow = true
        sun.shadow.mapSize.set(2048, 2048)
        sun.shadow.camera.left = -9
        sun.shadow.camera.right = 9
        sun.shadow.camera.top = 9
        sun.shadow.camera.bottom = -9
        sun.shadow.camera.near = 1
        sun.shadow.camera.far = 50
        sun.shadow.bias = -0.0005
        sun.shadow.normalBias = 0.02
        sun.shadow.radius = 3
        engine.add(sun)
      }

      async function loadModels() {
        const loader = new GLTFLoader()
        const entries = await Promise.all(
          Object.entries(MODELS).map(async ([name, hash]) => [
            name,
            await loader.loadAsync(BLOBS + hash),
          ])
        )
        return Object.fromEntries(entries)
      }

      function blockSize(block) {
        return new THREE.Box3().setFromObject(block).getSize(new THREE.Vector3()).x
      }

      /*
        Instances share geometry and materials with their source; only skinned
        models need SkeletonUtils, because a plain clone would leave every copy
        driven by the first one's bones.
      */
      function instance(gltf, { skinned = false } = {}) {
        const object = skinned ? SkeletonUtils.clone(gltf.scene) : gltf.scene.clone(true)
        object.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true
            child.receiveShadow = true
          }
        })
        return object
      }

      /*
        Sits an object's lowest point on a surface height, whatever its pivot.
        Call it before parenting: the box is measured in the object's own
        frame, which is then its parent's.
      */
      function standOn(object, surfaceY) {
        object.updateMatrixWorld(true)
        const box = new THREE.Box3().setFromObject(object)
        object.position.y += surfaceY - box.min.y
        return object
      }

      /*
        The island is a heightmap of blocks: a rounded grassy top with a small
        hill at the back, then dirt and stone layers that shrink as they go down
        into a jagged point. Edges are roughened with a seeded noise, so it reads
        as a chunk torn out of a world rather than a cylinder.
      */
      function buildIsland(models, B) {
        const group = new THREE.Group()
        const RADIUS = 4.2
        const surface = new Map()
        let peak = null

        for (let x = -5; x <= 5; x++) {
          for (let z = -5; z <= 5; z++) {
            const edge = RADIUS + Math.sin(x * 1.7 + z * 0.9) * 0.45 + Math.cos(z * 1.3 - x) * 0.35
            const distance = Math.hypot(x, z)
            if (distance > edge) continue

            const top = (Math.hypot(x + 1.5, z + 1.5) < 1.6 ? 1 : 0) + (x === -2 && z === -2 ? 1 : 0)
            surface.set(`${x},${z}`, top + 1)
            if (!peak || top + 1 > peak.level) peak = { x, z, level: top + 1 }

            for (let y = top; y >= -7; y--) {
              const sink = Math.max(0, -y) / 7.5
              const reach = edge * (1 - Math.pow(sink, 0.75)) - rng() * 0.9
              if (y < 0 && distance > reach) break
              const kind =
                y === top ? "grass" : y > -2 || (y > -4 && rng() < 0.35) ? "dirt" : "stone"
              const block = instance(models[kind])
              block.position.set(x * B, 0, z * B)
              standOn(block, y * B)
              group.add(block)
            }
          }
        }

        const island = { group, surface, peak, B }
        decorate(models, island)
        return island
      }

      function surfaceAt(island, x, z) {
        const level = island.surface.get(`${x},${z}`)
        return level === undefined ? null : level * island.B
      }

      /*
        Hand-placed rather than scattered: a cluster of trees on the hill, a
        fenced corner with a chest, flowers and grass along the open meadow.
        Random scatter on an island this small reads as clutter.
      */
      function decorate(models, island) {
        const B = island.B
        const place = (name, x, z, { rotate = rng() * Math.PI * 2, scale = 1, jitter = 0.3 } = {}) => {
          const surfaceY = surfaceAt(island, x, z)
          if (surfaceY === null) return null
          const object = instance(models[name])
          object.scale.multiplyScalar(scale)
          object.rotation.y = rotate
          object.position.set(
            x * B + (rng() - 0.5) * B * jitter,
            0,
            z * B + (rng() - 0.5) * B * jitter
          )
          standOn(object, surfaceY)
          island.group.add(object)
          return object
        }

        place("tree2", -1, -3, { scale: 0.7 })
        place("tree1", -3, -1, { scale: 0.65 })
        place("tree3", -3, 1, { scale: 0.6 })
        place("tree1", 3, -2, { scale: 0.55 })
        place("bush", -2, 0, { scale: 0.7 })
        place("bush", 2, 2, { scale: 0.6 })
        place("mushroom", -1, -1, { scale: 0.9 })
        place("rock2", 3, 1)
        place("rock1", 1, 3)
        place("crystal", 2, -3, { scale: 1.2 })

        for (const [x, z] of [[1, -1], [2, 0], [0, 2], [-2, 3], [3, 3], [-3, 3], [0, -2]]) {
          place(rng() > 0.5 ? "flowers1" : "flowers2", x, z)
        }
        for (const [x, z] of [[1, 1], [-1, 2], [4, 0], [2, 1], [-4, 0], [0, 4], [1, -3]]) {
          place("grassBig", x, z, { scale: 0.9 })
        }

        place("fenceEnd", 3, 4, { rotate: 0, jitter: 0 })
        place("fence", 2, 4, { rotate: 0, jitter: 0 })
        place("fenceEnd", 1, 4, { rotate: Math.PI, jitter: 0 })
        place("chest", 2, 3, { rotate: Math.PI, jitter: 0 })
      }

      /*
        Smaller islands adrift far off, bobbing out of step with the main one.
        Each is a little heightmap of its own — a grassy top a few cells wide
        over two or three shrinking layers — so it reads as a broken-off piece
        of the same world rather than a loose cube.
      */
      function buildIslet(models, B, [x, y, z], { radius, props }) {
        const group = new THREE.Group()
        const cells = []
        const span = Math.ceil(radius)

        for (let cx = -span; cx <= span; cx++) {
          for (let cz = -span; cz <= span; cz++) {
            const distance = Math.hypot(cx, cz)
            if (distance > radius + rng() * 0.3) continue
            cells.push([cx, cz])
            for (let cy = 0; cy >= -3; cy--) {
              const reach = radius * (1 - Math.pow(-cy / 3.5, 0.8)) - rng() * 0.5
              if (cy < 0 && distance > reach) break
              const kind = cy === 0 ? "grass" : cy === -1 ? "dirt" : "stone"
              const block = instance(models[kind])
              block.position.set(cx * B, 0, cz * B)
              standOn(block, cy * B)
              group.add(block)
            }
          }
        }

        for (const [name, scale] of props) {
          const [cx, cz] = cells[Math.floor(rng() * cells.length)]
          const prop = instance(models[name])
          prop.scale.multiplyScalar(scale)
          prop.rotation.y = rng() * Math.PI * 2
          prop.position.set(cx * B, 0, cz * B)
          standOn(prop, B)
          group.add(prop)
        }

        group.position.set(x * B, y * B, z * B)
        return { group, baseY: group.position.y }
      }

      /*
        numa's mark, as a small pennant on the highest point of the island —
        present without being a logo stamped over the scene. The cloth is a
        plane whose vertices ripple outward from the pole each frame.
      */
      function buildFlag(island, B) {
        const pole = new THREE.Group()
        const height = 1.9
        const stick = new THREE.Mesh(
          new THREE.CylinderGeometry(0.03, 0.035, height, 8),
          new THREE.MeshStandardMaterial({ color: 0x8b6b4a, roughness: 0.8 })
        )
        stick.position.y = height / 2
        stick.castShadow = true
        pole.add(stick)

        const knob = new THREE.Mesh(
          new THREE.SphereGeometry(0.06, 12, 8),
          new THREE.MeshStandardMaterial({ color: 0xf2c94c, metalness: 0.6, roughness: 0.3 })
        )
        knob.position.y = height + 0.04
        pole.add(knob)

        const geometry = new THREE.PlaneGeometry(0.9, 0.6, 16, 8)
        geometry.translate(0.45, 0, 0)
        const rest = geometry.attributes.position.array.slice()
        const cloth = new THREE.Mesh(
          geometry,
          new THREE.MeshStandardMaterial({ map: flagTexture(), side: THREE.DoubleSide, roughness: 0.9 })
        )
        cloth.position.set(0.03, height - 0.35, 0)
        cloth.castShadow = true
        pole.add(cloth)

        const { x, z, level } = island.peak
        pole.scale.setScalar(B * 1.35)
        pole.position.set(x * B, level * B, z * B)
        /* Turned so the cloth faces the camera's resting angle, mark readable. */
        pole.rotation.y = Math.PI / 4

        const positions = geometry.attributes.position
        const flag = {
          pole,
          update(t) {
            for (let i = 0; i < positions.count; i++) {
              const px = rest[i * 3]
              const py = rest[i * 3 + 1]
              const along = px / 0.9
              positions.setZ(i, Math.sin(px * 6 - t * 4.2 + py * 1.5) * 0.07 * along)
              positions.setY(i, py - along * 0.04)
            }
            positions.needsUpdate = true
            geometry.computeVertexNormals()
          },
        }
        island.group.userData.flag = flag
        return flag
      }

      /*
        The pennant face: the mark from `logo.svg` drawn on white cloth. The
        image loads asynchronously and the texture is flagged for upload once it
        has, so the flag simply appears plain for a frame or two before.
      */
      function flagTexture() {
        const canvas = document.createElement("canvas")
        canvas.width = 256
        canvas.height = 170
        const context = canvas.getContext("2d")
        context.fillStyle = "#ffffff"
        context.fillRect(0, 0, canvas.width, canvas.height)
        const texture = new THREE.CanvasTexture(canvas)
        texture.colorSpace = THREE.SRGBColorSpace
        texture.anisotropy = 4

        const image = new Image()
        image.onload = () => {
          const h = 104
          const w = (image.width / image.height) * h
          context.drawImage(image, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h)
          texture.needsUpdate = true
        }
        image.src = "./logo.svg"
        return texture
      }

      /*
        Animals wandering the meadow: each picks a spot on the flat open part
        of the island, walks there, then idles or grazes a while. Targets come
        from the surface map, so nobody ever walks off the edge or into the hill.
      */
      function spawnCritters(models, island, B) {
        const cells = [...island.surface.entries()]
          .filter(([, level]) => level === 1)
          .map(([key]) => key.split(",").map(Number))
          .filter(([x, z]) => Math.hypot(x, z) < 3.2 && x > -1)

        const roster = [
          { name: "sheep", walk: "Walk", idle: ["Idle", "Idle_Eating"], speed: 0.55, scale: 0.75 },
          { name: "sheep", walk: "Walk", idle: ["Idle_Eating", "Idle"], speed: 0.5, scale: 0.7 },
          { name: "pig", walk: "Walk", idle: ["Idle", "Idle_Eating"], speed: 0.5, scale: 0.7 },
          { name: "chick", walk: "Run", idle: ["Idle_Peck", "Idle"], speed: 0.7, scale: 0.6 },
          { name: "chick", walk: "Run", idle: ["Idle", "Idle_Peck"], speed: 0.75, scale: 0.55 },
        ]

        function play(critter, action) {
          if (critter.current === action) return
          action.reset().fadeIn(0.3).play()
          critter.current?.fadeOut(0.3)
          critter.current = action
        }

        const critters = roster.map((spec, i) => {
          const gltf = models[spec.name]
          const object = instance(gltf, { skinned: true })
          object.scale.multiplyScalar(spec.scale)
          object.rotation.y = rng() * Math.PI * 2
          const [x, z] = cells[(i * 5) % cells.length]
          object.position.set(x * B, 0, z * B)
          standOn(object, B)
          island.group.add(object)

          const mixer = new THREE.AnimationMixer(object)
          const clip = (name) =>
            gltf.animations.find((animation) => animation.name.endsWith(name)) ??
            gltf.animations[0]
          const critter = {
            spec,
            object,
            mixer,
            actions: {
              walk: mixer.clipAction(clip(spec.walk)),
              idle: spec.idle.map((name) => mixer.clipAction(clip(name))),
            },
            groundY: object.position.y,
            target: null,
            wait: 1 + rng() * 3,
            current: null,
          }
          play(critter, critter.actions.idle[0])
          return critter
        })

        const step = new THREE.Vector3()
        return {
          update(dt) {
            for (const critter of critters) {
              critter.mixer.update(dt)
              if (critter.target) {
                step.subVectors(critter.target, critter.object.position)
                step.y = 0
                const distance = step.length()
                if (distance < 0.05 * B) {
                  critter.target = null
                  critter.wait = 2 + rng() * 4
                  const idles = critter.actions.idle
                  play(critter, idles[Math.floor(rng() * idles.length)])
                  continue
                }
                const heading = Math.atan2(step.x, step.z)
                critter.object.rotation.y = dampAngle(critter.object.rotation.y, heading, 0.15, dt)
                step.normalize().multiplyScalar(Math.min(distance, critter.spec.speed * B * dt))
                critter.object.position.add(step)
              } else if (dt > 0 && (critter.wait -= dt) <= 0) {
                const [x, z] = cells[Math.floor(rng() * cells.length)]
                critter.target = new THREE.Vector3(
                  (x + (rng() - 0.5) * 0.6) * B,
                  critter.groundY,
                  (z + (rng() - 0.5) * 0.6) * B
                )
                play(critter, critter.actions.walk)
              }
            }
          },
        }
      }

      function dampAngle(current, target, halfLife, dt) {
        const delta = Math.atan2(Math.sin(target - current), Math.cos(target - current))
        return current + delta * (1 - Math.pow(0.5, dt / halfLife))
      }

      /*
        Low-poly cumulus: a handful of flattened, flat-shaded spheres per cloud,
        at several depths — some below the island, which is what sells
        "floating" more than anything above it.
      */
      function buildClouds() {
        const group = new THREE.Group()
        const puff = new THREE.IcosahedronGeometry(1, 1)
        const DRIFT = 7
        const clouds = []

        const spots = [
          [-9, 3.5, -10, 1.3],
          [8, 5, -12, 1.1],
          [11, -1.5, 3, 1],
          [-12, -3, 2, 1.2],
          [3, -6.5, 6, 1.4],
          [-4, 6.5, -6, 0.8],
          [6, -4, -6, 0.9],
        ]
        for (const [x, y, z, size] of spots) {
          const cloud = new THREE.Group()
          /* Its own material, so each cloud can fade independently. */
          const material = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 1,
            flatShading: true,
            transparent: true,
            opacity: 0,
          })
          const puffs = 4 + Math.floor(rng() * 3)
          for (let i = 0; i < puffs; i++) {
            const mesh = new THREE.Mesh(puff, material)
            const r = 0.6 + rng() * 0.6
            mesh.scale.set(r * 1.3, r * 0.75, r)
            mesh.position.set((i - puffs / 2) * 0.75 + rng() * 0.3, rng() * 0.35, (rng() - 0.5) * 0.6)
            cloud.add(mesh)
          }
          cloud.scale.setScalar(size)
          cloud.position.set(x, y, z)
          group.add(cloud)
          clouds.push({
            cloud,
            material,
            speed: 0.15 + rng() * 0.2,
            home: x,
            offset: (rng() * 2 - 1) * DRIFT,
          })
        }

        return {
          group,
          /*
            Each cloud drifts across a stretch of sky and loops back to its
            start. The jump back used to show as a cloud popping into view, so
            the cloud now fades out over the last part of the stretch and back
            in over the first, and the loop happens while it is invisible.
          */
          update(dt) {
            for (const entry of clouds) {
              entry.offset += entry.speed * dt
              if (entry.offset > DRIFT) entry.offset -= DRIFT * 2
              entry.cloud.position.x = entry.home + entry.offset
              const edge = 1 - Math.abs(entry.offset) / DRIFT
              entry.material.opacity = 0.92 * Math.min(1, edge / 0.3)
            }
          },
        }
      }

      /* A tiny seeded generator, so the island has the same shape on every visit. */
      function mulberry32(seed) {
        return () => {
          seed |= 0
          seed = (seed + 0x6d2b79f5) | 0
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296
        }
      }
    </script>
  </body>
