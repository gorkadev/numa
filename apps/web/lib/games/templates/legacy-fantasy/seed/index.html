<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>numa — your game goes here</title>

    <!--
      The import map is what makes `import * as THREE from "three"` work with no
      bundler and no network: it points the bare specifiers at the copy of
      three.js that ships inside the sandbox. Every game needs these two lines,
      and they must live in the document that loads the modules — an import map
      inside a module file does nothing.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>

    <style>
      :root {
        --fg: #3b2a1a;
        --muted: rgba(59, 42, 26, 0.72);
        --accent: #2d5f8a;
      }

      html,
      body {
        height: 100%;
      }

      /*
        The sky the scene paints, so the page already looks finished before
        the sprites arrive — and stays finished if they never do.
      */
      body {
        margin: 0;
        overflow: hidden;
        background: #93e3e4;
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      canvas {
        opacity: 0;
        transition: opacity 0.8s ease;
      }

      body.ready canvas {
        opacity: 1;
      }

      #overlay {
        position: fixed;
        inset: auto 0 0;
        z-index: 2;
        display: flex;
        justify-content: center;
        padding: 0 1rem max(1.5rem, 5vh);
        pointer-events: none;
      }

      /* The kit's own paper panel, stretched with border-image. */
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        max-width: 24rem;
        padding: 0.5rem 0.75rem;
        border-style: solid;
        border-width: 12px;
        border-image: url(./assets/legacy-fantasy/ui/panel-paper.png) 6 fill /
          12px / 0 stretch;
        image-rendering: pixelated;
        text-align: center;
        animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }

      h1 {
        margin: -0.4rem 0 0;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: var(--muted);
        text-wrap: balance;
      }

      .hint {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0.25rem 0 -0.5rem;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--accent);
      }

      /*
        Three dots pulsing is the only moving thing guaranteed to be on screen:
        if WebGL is unavailable the scene never appears, and a completely still
        page is indistinguishable from a broken one.
      */
      .dots {
        display: inline-flex;
        gap: 0.22rem;
      }

      .dots span {
        width: 0.28rem;
        height: 0.28rem;
        background: currentColor;
        animation: pulse 1.4s steps(2) infinite;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.18s;
      }

      .dots span:nth-child(3) {
        animation-delay: 0.36s;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        canvas,
        .card {
          transition: none;
          animation: none;
        }

        .dots span {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>

  <body>
    <div id="overlay">
      <div class="card">
        <h1 data-copy="title">Your game will appear here</h1>
        <p data-copy="body">
          Describe the game you want in the chat and it starts building right
          here.
        </p>
        <span class="hint">
          <span class="dots" aria-hidden="true"
            ><span></span><span></span><span></span
          ></span>
          <span data-copy="hint">Waiting for your idea</span>
        </span>
      </div>
    </div>

    <script type="module">
      /*
        The app speaks English and Spanish; the frame cannot ask it which one
        is active, so it follows the browser instead. English is the fallback
        already in the markup.
      */
      const COPY = {
        es: {
          title: "Aquí aparecerá tu juego",
          body: "Describe en el chat el juego que quieres y empezará a construirse aquí mismo.",
          hint: "Esperando tu idea",
        },
      }
      const language = (navigator.language || "en").slice(0, 2)
      if (COPY[language]) {
        document.documentElement.lang = language
        for (const element of document.querySelectorAll("[data-copy]")) {
          element.textContent = COPY[language][element.dataset.copy]
        }
      }
    </script>

    <script type="module">
      import {
        createEngine,
        createSprite,
        createTileLayer,
        loadPixelTexture,
      } from "./engine/index.js"

      /*
        A forest clearing from the template's own sprites, built the way
        TEMPLATE.md describes: sky, a far forest strip, a grass block from the
        named tiles, then props and the hero, ordered by layer. Replace this
        page with the game.
      */
      const A = "./assets/legacy-fantasy/"
      const PPU = 16
      const WIDTH = 30

      try {
        await start()
        document.body.classList.add("ready")
      } catch (error) {
        /* The painted sky and the card are a complete page on their own. */
        console.warn("welcome scene unavailable", error)
      }

      async function start() {
        const engine = createEngine({
          orthographic: true,
          frustumSize: 15,
          cameraPosition: [(WIDTH - 1) / 2, -1, 10],
          lookAt: [(WIDTH - 1) / 2, -1, 0],
          shadows: false,
          antialias: false,
          background: 0x93e3e4,
        })

        const files = {
          tiles: "terrain/tiles.png",
          sky: "backgrounds/sky.png",
          strip: "backgrounds/forest-strip-light.png",
          forest: "backgrounds/forest-dark.png",
          tree: "trees/green/tree-2.png",
          treeSmall: "trees/green/tree-4.png",
          rock: "props/mossy-rock-1.png",
          mushroom: "props/mushroom-2.png",
          bush: "props/bush-1.png",
          chest: "items/chest-closed.png",
          hero: "character/idle.png",
          boar: "mobs/boar/idle.png",
        }
        const tex = Object.fromEntries(
          await Promise.all(
            Object.entries(files).map(async ([key, path]) => [
              key,
              await loadPixelTexture(A + path),
            ])
          )
        )

        const place = (texture, [x, y], layer, frame = null, anchor = [0.5, 0]) => {
          const s = createSprite(engine, {
            animations: {
              a: frame ?? {
                texture,
                frameWidth: texture.image.width,
                frameHeight: texture.image.height,
              },
            },
            pixelsPerUnit: PPU,
            anchor,
            layer,
            ySort: false,
          })
          s.object.position.set(x, y, 0)
          engine.add(s.object)
          return s
        }

        /* Grass block tiles: grass.tuft/top/upper/center/bottom rows, -left/-right edges. */
        const GRASS = { tuft: 0, top: 25, upper: 50, center: 75, bottom: 100 }
        const grid = ["tuft", "top", "upper", "center", "center", "center", "center", "bottom"].map((row) =>
          Array.from({ length: WIDTH }, (_, c) =>
            GRASS[row] + (c === 0 ? 0 : c === WIDTH - 1 ? 4 : 1 + ((c - 1) % 3))
          )
        )
        engine.add(
          createTileLayer({ texture: tex.tiles, tileSize: 16, grid, origin: [0, -2], layer: 3 }).mesh
        )

        const SURFACE = -2.5
        place(tex.sky, [(WIDTH - 1) / 2, SURFACE - 1], 0)
        for (let i = 0; i < 6; i++) place(tex.strip, [i * 6, SURFACE - 3], 1)
        place(tex.forest, [6, SURFACE - 1], 2)
        place(tex.forest, [26, SURFACE - 1], 2)
        place(tex.tree, [3, SURFACE], 4)
        place(tex.treeSmall, [25, SURFACE], 4)
        place(tex.rock, [20, SURFACE], 4)
        place(tex.mushroom, [9, SURFACE], 4)
        place(tex.chest, [22.5, SURFACE], 4)
        place(
          tex.boar,
          [17, SURFACE],
          5,
          { texture: tex.boar, frameWidth: 48, frameHeight: 32, frames: 4, fps: 10 }
        ).flipX = true
        place(
          tex.hero,
          [12, SURFACE],
          6,
          { texture: tex.hero, frameWidth: 112, frameHeight: 80, frames: 4, fps: 10 },
          [0.5, 0.2]
        )
        place(tex.bush, [28, SURFACE], 7)

        engine.start()
      }
    </script>
  </body>
</html>
