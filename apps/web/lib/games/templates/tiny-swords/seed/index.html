<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>numa — your game goes here</title>

    <!--
      The import map is what makes `import * as THREE from "three"` work with no
      bundler and no network: it points the bare specifiers at the copy of
      three.js that ships inside the sandbox. Every game needs these two lines,
      and they must live in the document that loads the modules — an import map
      inside a module file does nothing.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>

    <style>
      :root {
        --fg: #3b2a1a;
        --muted: rgba(59, 42, 26, 0.72);
        --accent: #2d5f8a;
      }

      html,
      body {
        height: 100%;
      }

      /*
        The sea the scene paints, so the page already looks finished before
        the sprites arrive — and stays finished if they never do.
      */
      body {
        margin: 0;
        overflow: hidden;
        background: #47aba9;
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      canvas {
        opacity: 0;
        transition: opacity 0.8s ease;
      }

      body.ready canvas {
        opacity: 1;
      }

      #overlay {
        position: fixed;
        inset: auto 0 0;
        z-index: 2;
        display: flex;
        justify-content: center;
        padding: 0 1rem max(1.5rem, 5vh);
        pointer-events: none;
      }

      /* The kit's own paper panel, stretched with border-image. */
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        max-width: 24rem;
        border-style: solid;
        border-width: 32px;
        border-image: url(./assets/tiny-swords/ui/regular-paper.png) 64 fill /
          32px / 0 stretch;
        image-rendering: pixelated;
        text-align: center;
        animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }

      h1 {
        margin: -0.4rem 0 0;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: var(--muted);
        text-wrap: balance;
      }

      .hint {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0.25rem 0 -0.5rem;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--accent);
      }

      /*
        Three dots pulsing is the only moving thing guaranteed to be on screen:
        if WebGL is unavailable the scene never appears, and a completely still
        page is indistinguishable from a broken one.
      */
      .dots {
        display: inline-flex;
        gap: 0.22rem;
      }

      .dots span {
        width: 0.28rem;
        height: 0.28rem;
        background: currentColor;
        animation: pulse 1.4s steps(2) infinite;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.18s;
      }

      .dots span:nth-child(3) {
        animation-delay: 0.36s;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        canvas,
        .card {
          transition: none;
          animation: none;
        }

        .dots span {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>

  <body>
    <div id="overlay">
      <div class="card">
        <h1 data-copy="title">Your game will appear here</h1>
        <p data-copy="body">
          Describe the game you want in the chat and it starts building right
          here.
        </p>
        <span class="hint">
          <span class="dots" aria-hidden="true"
            ><span></span><span></span><span></span
          ></span>
          <span data-copy="hint">Waiting for your idea</span>
        </span>
      </div>
    </div>

    <script type="module">
      /*
        The app speaks English and Spanish; the frame cannot ask it which one
        is active, so it follows the browser instead. English is the fallback
        already in the markup.
      */
      const COPY = {
        es: {
          title: "Aquí aparecerá tu juego",
          body: "Describe en el chat el juego que quieres y empezará a construirse aquí mismo.",
          hint: "Esperando tu idea",
        },
      }
      const language = (navigator.language || "en").slice(0, 2)
      if (COPY[language]) {
        document.documentElement.lang = language
        for (const element of document.querySelectorAll("[data-copy]")) {
          element.textContent = COPY[language][element.dataset.copy]
        }
      }
    </script>

    <script type="module">
      import {
        autotile16,
        createEngine,
        createSprite,
        createTileLayer,
        loadPixelTexture,
      } from "./engine/index.js"

      /*
        A small island from the template's own sprites, built the way
        TEMPLATE.md describes: foam, flat ground, a plateau with its shadow and
        cliff, then everything standing, y-sorted. Replace this page with the
        game.
      */
      const LAND = [
        "...#######...",
        "..#########..",
        ".###########.",
        ".###########.",
        "..#########..",
        "...#######...",
      ].map((row) => [...row].map((cell) => cell === "#"))
      const HIGH = [
        ".............",
        ".............",
        "........###..",
        "........###..",
        ".............",
        ".............",
      ].map((row) => [...row].map((cell) => cell === "#"))

      const COLUMNS = LAND[0].length
      const ROWS = LAND.length

      try {
        await start()
        document.body.classList.add("ready")
      } catch (error) {
        /* The painted sea and the card are a complete page on their own. */
        console.warn("welcome scene unavailable", error)
      }

      async function start() {
        const engine = createEngine({
          orthographic: true,
          frustumSize: 11,
          cameraPosition: [(COLUMNS - 1) / 2, -(ROWS - 1) / 2 + 0.2, 10],
          lookAt: [(COLUMNS - 1) / 2, -(ROWS - 1) / 2 + 0.2, 0],
          shadows: false,
          antialias: false,
          background: 0x47aba9,
        })

        const [
          flatTiles,
          highTiles,
          foam,
          shadow,
          tree,
          house,
          bush,
          sheep,
          warrior,
        ] = await Promise.all(
          [
            "./assets/tiny-swords/terrain/tilemap-color1.png",
            "./assets/tiny-swords/terrain/tilemap-color2.png",
            "./assets/tiny-swords/terrain/water-foam.png",
            "./assets/tiny-swords/terrain/shadow.png",
            "./assets/tiny-swords/resources/tree-1.png",
            "./assets/tiny-swords/buildings/blue/house1.png",
            "./assets/tiny-swords/decorations/bush-1.png",
            "./assets/tiny-swords/resources/sheep-idle.png",
            "./assets/tiny-swords/units/blue/warrior/idle.png",
          ].map((url) => loadPixelTexture(url))
        )

        const water = (r, c) => !LAND[r]?.[c]
        LAND.forEach((row, r) =>
          row.forEach((isLand, c) => {
            const coast = [-1, 0, 1].some((dr) =>
              [-1, 0, 1].some((dc) => water(r + dr, c + dc))
            )
            if (!isLand || !coast) return
            const s = createSprite(engine, {
              animations: {
                foam: { texture: foam, frameWidth: 192, frameHeight: 192, frames: 16, fps: 10 },
              },
              layer: 0,
              ySort: false,
              frame: (r * 7 + c * 3) % 16,
            })
            s.object.position.set(c, -r, 0)
            engine.add(s.object)
          })
        )

        engine.add(
          createTileLayer({
            texture: flatTiles,
            tileSize: 64,
            grid: autotile16(LAND, { column: 0, row: 0, columns: 9 }),
            layer: 1,
          }).mesh
        )

        const cliffs = HIGH.map((row) => row.map(() => null))
        HIGH.forEach((row, r) =>
          row.forEach((isHigh, c) => {
            if (!isHigh) return
            const s = createSprite(engine, {
              animations: { s: { texture: shadow, frameWidth: 192, frameHeight: 192 } },
              layer: 2,
              ySort: false,
            })
            s.object.position.set(c, -(r + 1), 0)
            engine.add(s.object)
            if (HIGH[r + 1]?.[c]) return
            const left = row[c - 1] && !HIGH[r + 1]?.[c - 1]
            const right = row[c + 1] && !HIGH[r + 1]?.[c + 1]
            cliffs[r + 1][c] =
              (LAND[r + 1]?.[c] ? 41 : 50) + (left ? (right ? 1 : 2) : right ? 0 : 3)
          })
        )
        engine.add(
          createTileLayer({
            texture: highTiles,
            tileSize: 64,
            grid: autotile16(HIGH, { column: 5, row: 0, columns: 9 }),
            layer: 3,
          }).mesh
        )
        engine.add(
          createTileLayer({ texture: highTiles, tileSize: 64, grid: cliffs, layer: 3 }).mesh
        )

        const place = (texture, frame, [x, y], anchor, options = {}) => {
          const s = createSprite(engine, {
            animations: { a: { texture, ...frame } },
            anchor,
            layer: 5,
            ...options,
          })
          s.object.position.set(x, y, 0)
          engine.add(s.object)
          return s
        }

        const TREE = { frameWidth: 192, frameHeight: 256, frames: 8, fps: 10 }
        place(tree, TREE, [3, -0.6], [0.5, 0.06], { frame: 0 })
        place(tree, TREE, [4.2, -0.9], [0.5, 0.06], { frame: 3 })
        place(tree, TREE, [9, -1.6], [0.5, 0.06], { frame: 5 })
        place(house, { frameWidth: 128, frameHeight: 192, frames: 1 }, [5.6, -1.3], [0.5, 0.06])
        place(bush, { frameWidth: 128, frameHeight: 128, frames: 8, fps: 10 }, [2.2, -3.2], [0.5, 0.36])
        place(sheep, { frameWidth: 128, frameHeight: 128, frames: 6, fps: 10 }, [6.6, -4.4], [0.5, 0.36])
        place(
          warrior,
          { frameWidth: 192, frameHeight: 192, frames: 8, fps: 10 },
          [5, -3.2],
          [0.5, 0.29]
        )

        engine.start()
      }
    </script>
  </body>
</html>
